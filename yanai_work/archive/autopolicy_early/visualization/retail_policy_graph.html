ks related to any other user."}, {"font": {"color": "black"}, "group": "rule", "id": "Rule_3", "label": "Rule 3\nIn a single conversation,...", "shape": "dot", "size": 10, "title": "Rule ID: 3\n\nDescription:\nIn a single conversation, the user must be assisted for only\none user; requests for tasks related to any other user must\nbe denied.\n\nScope:\nPer conversation."}, {"font": {"color": "black"}, "group": "policy", "id": "Policy_3", "label": "Policy 3\nBefore taking consequenti...", "shape": "box", "size": 10, "title": "Policy ID: 3\n\nDescription:\nBefore taking consequential actions that update the database\n(cancel, modify, return, exchange), you have to list the\naction detail and obtain explicit user confirmation (yes) to\nproceed."}, {"font": {"color": "black"}, "group": "rule", "id": "Rule_4", "label": "Rule 4\nBefore performing any con...", "shape": "dot", "size": 10, "title": "Rule ID: 4\n\nDescription:\nBefore performing any consequential action (cancel, modify,\nreturn, or exchange) that updates the database, the user\nmust be shown the action detail and provide explicit\nconfirmation by replying \u0027yes\u0027 to proceed.\n\nScope:\nBefore taking consequential actions that update the database\n(cancel, modify, return, exchange)."}, {"font": {"color": "black"}, "group": "policy", "id": "Policy_4", "label": "Policy 4\nYou should not make up an...", "shape": "box", "size": 10, "title": "Policy ID: 4\n\nDescription:\nYou should not make up any information or knowledge or\nprocedures not provided from the user or the tools, or give\nsubjective recommendations or comments."}, {"font": {"color": "black"}, "group": "rule", "id": "Rule_5", "label": "Rule 5\nThe user must not rely on...", "shape": "dot", "size": 10, "title": "Rule ID: 5\n\nDescription:\nThe user must not rely on information or procedures that are\nnot provided by the user or by the tools; do not request or\naccept fabricated or subjective guidance.\n\nScope:\nAll interactions with users."}, ription:\nAfter user confirmation, the order status will be changed to\n\u0027cancelled\u0027, and the total will be refunded via the original\npayment method immediately if it is gift card, otherwise in\n5 to 7 business days."}, {"font": {"color": "black"}, "group": "rule", "id": "Rule_13", "label": "Rule 13\nAfter cancellation is con...", "shape": "dot", "size": 10, "title": "Rule ID: 13\n\nDescription:\nAfter cancellation is confirmed, the refund will be issued\nto the original payment method; if the original method was a\ngift card, the refund is issued immediately; otherwise, the\nrefund takes 5 to 7 business days.\n\nScope:\nCancellation process."}, {"font": {"color": "black"}, "group": "policy", "id": "Policy_13", "label": "Policy 13\nModify pending order - An...", "shape": "box", "size": 10, "title": "Policy ID: 13\n\nDescription:\nModify pending order - An order can only be modified if its\nstatus is \u0027pending\u0027, and you should check its status before\ntaking the action. For a pending order, you can take actions\nto modify its shipping address, payment method, or product\nitem options, but nothing else."}, {"font": {"color": "black"}, "group": "rule", "id": "Rule_14", "label": "Rule 14\nA pending order may be mo...", "shape": "dot", "size": 10, "title": "Rule ID: 14\n\nDescription:\nA pending order may be modified only if its status is\n\u0027pending\u0027, and allowed modifications are the shipping\naddress, the payment method, or product item options (no\nother changes).\n\nScope:\nModify pending orders."}, {"font": {"color": "black"}, "group": "policy", "id": "Policy_14", "label": "Policy 14\nModify payment - The user...", "shape": "box", "size": 10, "title": "Policy ID: 14\n\nDescription:\nModify payment - The user can only choose a single payment\nmethod different from the original payment method. If the\nuser wants the modify the payment method to gift card, it\nmust have enough balance to cover the total amount. After\nuser confirmation, the
